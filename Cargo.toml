[package]
name = "unpm"
version = "0.0.1"
edition = "2024"

[dependencies]
anyhow = "1.0.105"
clap = { version = "4.6.10", features = ["derive", "unstable-ext"] }
clap_complete = { version = "4.6.12", features = ["unstable-dynamic"] }
color-print = "0.3.7"
dialoguer = "0.12.0"
directories = "6.0.0"
env_logger = "0.11.10"
indexmap = { version = "2.14.0", features = ["serde"] }
jiff = { version = "1.0.2", features = ["serde"] }
log = "0.4.30"
package_json_schema = "0.3.0"
reqwest = { version = "0.13.4", features = ["query", "blocking", "rustls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["preserve_order"] }
strum = { version = "0.28.0", features = ["derive"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
